name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run portable tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          sh tests/test_store_init.sh
          python3 -m py_compile bookmark_helper.py
